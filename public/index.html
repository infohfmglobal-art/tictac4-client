<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="theme-rune">
  <!-- SPLASH -->
  <div id="introSplash" class="splash">
    <img src="./logo-dragon.png" alt="FrameWeave Studio" class="splash-logo" />
    <h1 class="brand"><span class="glow">Rune</span><span class="spark">XO</span></h1>
    <p class="tag">Every Move Shapes Destiny.</p>
    <small>© FrameWeave Studio LLC</small>
  </div>

  <!-- LOGIN -->
  <section id="loginGate" class="login hidden">
    <h1 class="brand brand-small"><span class="glow">Rune</span><span class="spark">XO</span></h1>
    <p class="tag">Every Move Shapes Destiny.</p>
    <div class="login-btns">
      <button id="guestLoginGate" class="btn primary">🔥 Play as Guest</button>
      <button id="googleLoginGate" class="btn">🔐 Login with Google</button>
    </div>
  </section>

  <!-- FLASH -->
  <div id="flashOverlay" class="flash-overlay flash-hide"></div>

  <!-- HOME / MENU -->
  <section id="homeScreen" class="home hidden">
    <div class="playerbar">
      <span id="playerName" class="playername">Guest Player</span>
      <span id="playerCoins" class="coins">💰 0</span>
      <button id="leaderBtn" class="btn small">🏆 Leaderboard</button>
      <button id="logoutBtn" class="btn small danger">Logout</button>
    </div>

    <div class="menu">
      <h2 class="menu-logo"><span class="glow">Rune</span><span class="spark">XO</span></h2>

      <div class="menu-row">
        <label>Game Mode</label>
        <select id="gameMode">
          <option>Player vs CPU</option>
          <option>Player vs Player</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Difficulty</label>
        <select id="difficulty">
          <option>Easy</option>
          <option>Normal</option>
          <option>Hard</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Skin</label>
        <select id="skin">
          <option>Runes</option>
          <option>Classic X / O</option>
          <option>Fruit</option>
          <option>Emoji</option>
          <option>Phoenix</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Theme</label>
        <select id="themeSelect">
          <option>Rune</option>
          <option>Gold</option>
          <option>Blue</option>
          <option>Neon</option>
        </select>
      </div>

      <div class="menu-actions">
        <button id="startBtn" class="btn primary big">Play</button>
      </div>
    </div>
  </section>

  <!-- GAME AREA -->
  <section id="gameArea" class="game hidden">
    <div class="board" id="gameBoard">
      <button class="cell" data-index="0"></button>
      <button class="cell" data-index="1"></button>
      <button class="cell" data-index="2"></button>
      <button class="cell" data-index="3"></button>
      <button class="cell" data-index="4"></button>
      <button class="cell" data-index="5"></button>
      <button class="cell" data-index="6"></button>
      <button class="cell" data-index="7"></button>
      <button class="cell" data-index="8"></button>
    </div>

    <!-- HUD (bottom center + right) -->
    <div class="hud">
      <div class="hud-left">
        <button id="homeBtn" class="btn small">🏠 Home</button>
        <button id="nextRoundBtn" class="btn small">🔁 Next Round</button>
        <button id="resetBtn" class="btn small">♻️ Reset</button>
      </div>
      <div class="hud-right">
        <button id="musicBtn" class="btn small">🔈 Music ON</button>
        <button id="sfxBtn" class="btn small">🔊 SFX ON</button>
      </div>
    </div>
  </section>

  <!-- RUNE ALERT (replaces browser alert) -->
  <div id="runeAlert" class="rune-alert hidden">
    <div class="rune-alert-box">
      <h3 id="runeAlertTitle">Title</h3>
      <p id="runeAlertMsg">Message</p>
      <button id="runeAlertOk" class="btn primary">OK</button>
    </div>
  </div>

  <!-- SIMPLE LEADERBOARD MODAL -->
  <div id="leaderModal" class="leader-modal hidden">
    <div class="leader-box">
      <div class="leader-head">
        <h3>🏆 Leaderboard</h3>
        <button id="leaderClose" class="btn small">✖</button>
      </div>
      <div id="leaderList" class="leader-list"></div>
      <div class="leader-foot">
        <button id="leaderLogout" class="btn small danger">Logout</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    // PWA install prompt (optional)
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</body>
</html>
