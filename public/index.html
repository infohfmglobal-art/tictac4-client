<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuneXO</title>

  <!-- Fonts & CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="splash.css">

  <script>
    // PWA install hook
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">
  <!-- Splash (optional; will fade out) -->
  <div id="splash-screen">
    <img src="logo-dragon.png" class="splash-logo" />
    <div class="splash-title">RUNEXO</div>
  </div>

  <!-- Background canvas (not used for flying; static only) -->
  <canvas id="runeParticles"></canvas>

  <!-- ===== HOME SCREEN ===== -->
  <section id="home" class="screen">
    <h1 class="game-title">RuneXO</h1>

    <div class="home-grid">
      <div class="card">
        <h3>Game Mode</h3>
        <select id="modeSelect">
          <option value="pvp">Player vs Player</option>
          <option value="pvc" selected>Player vs CPU</option>
        </select>
      </div>

      <div class="card">
        <h3>Difficulty</h3>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="card">
        <h3>Skin</h3>
        <select id="skinSelect">
          <option value="runes" selected>Dragon / Phoenix</option>
          <option value="classic">Classic X / O</option>
          <option value="fruit">Apple / Orange</option>
        </select>
      </div>

      <div class="card">
        <h3>Theme</h3>
        <select id="themeSelect">
          <option>Rune</option>
          <option>Gold</option>
          <option>Blue</option>
          <option>Classic</option>
        </select>
      </div>
    </div>

    <div class="btngrp">
      <button id="playBtn" class="btn">Start Game</button>
      <button id="installBtn" class="btn small">Install App</button>
    </div>

    <h3 class="mt">Leaderboard (Top 10 fastest wins vs CPU)</h3>
    <ol id="leaderboard" class="leader"></ol>
  </section>

  <!-- ===== GAME SCREEN ===== -->
  <section id="game" class="screen hidden">
    <h1 class="game-title">RuneXO</h1>

    <div class="topbar">
      <span class="badge">Mode: <span id="modeLabel">PvC</span></span>
      <span class="badge">Difficulty: <span id="diffLabel">Medium</span></span>
      <span class="badge">Skin: <span id="skinLabel">Runes</span></span>
    </div>

    <div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>

    <div id="msg" class="msg winner-banner">
      <span class="crown-burst">👑</span>
      <span id="winnerText"></span>
    </div>

    <div id="board" class="board"></div>

    <div class="btngrp">
      <button id="homeBtn" class="btn small">Home</button>
      <button id="nextBtn" class="btn">Next Round</button>
      <button id="resetBtn" class="btn red">Reset All</button>
      <button id="sfxBtn" class="btn small">SFX: On</button>
    </div>
  </section>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>
  <script type="module" src="splash.js"></script>
  <script type="module" src="runes.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>
</body>
</html>
