<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-512.png" />
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <script>
    // Capture PWA install prompt
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">

  <!-- 🐉 INTRO SPLASH (3s) -->
  <div id="introSplash" class="intro-splash">
    <img src="./logo-dragon.png" alt="FrameWeave Studio" class="splash-logo" />
    <h1 class="splash-title glow">RuneXO</h1>
    <p class="splash-tagline">Every Move Shapes Destiny.</p>
    <p class="studio-credit">© FrameWeave Studio LLC</p>
    <!-- Optional short bell -->
    <audio id="introBell" src="./sound/intro.mp3" preload="auto"></audio>
  </div>

  <!-- ✨ LOGIN GATE -->
  <div id="loginGate" class="login-gate hidden">
    <h1 class="login-logo"><span class="glow">Rune</span><span class="spark">XO</span></h1>
    <p class="login-tagline">Every Move Shapes Destiny.</p>
    <button id="guestLoginGate" class="login-btn">🔥 Play as Guest</button>
    <button id="googleLoginGate" class="login-btn">🔑 Login with Google</button>
  </div>

  <!-- ⚡ GOLDEN FLASH OVERLAY -->
  <div id="flashOverlay" class="flash-overlay"></div>

  <!-- 🏠 HOME SCREEN -->
  <div id="homeScreen" class="home-screen hidden">
    <div class="topbar">
      <div id="playerInfo" class="player-info">
        <span id="playerName">Guest Player</span>
        <span id="playerCoins" class="badge coin">💰 0</span>
        <button id="logoutBtn" class="mini-btn">Logout</button>
      </div>
    </div>

    <div class="menu-box">
      <h2 class="menu-logo"><span class="glow">Rune</span><span class="spark">XO</span></h2>

      <div class="menu-row">
        <label>Game Mode</label>
        <select id="gameMode">
          <option>Player vs CPU</option>
          <option>Player vs Player</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Difficulty</label>
        <select id="difficulty">
          <option>Easy</option>
          <option>Normal</option>
          <option>Hard</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Skin</label>
        <select id="skin">
          <option>Runes</option>
          <option>Classic X / O</option>
          <option>Fruit</option>
          <option>Emoji</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Theme</label>
        <select id="themeSelect">
          <option>Rune</option>
          <option>Gold</option>
          <option>Blue</option>
          <option>Neon</option>
        </select>
      </div>

      <button id="startBtn" class="menu-btn play-btn">Play</button>
      <button id="leaderBtn" class="menu-btn secondary">🏆 Leaderboard</button>
    </div>
  </div>

  <!-- 🏆 LEADERBOARD POPUP -->
  <div id="leaderModal" class="modal hidden">
    <div class="modal-card">
      <h3 class="leader-title">🏆 Top Players</h3>
      <ol id="leaderList" class="leader-list"></ol>
      <button id="closeLeader" class="menu-btn close">Close</button>
    </div>
  </div>

  <!-- 🎮 GAME AREA -->
  <div id="gameArea" class="hidden">
    <div class="hud">
      <div class="hud-left">
        <button id="homeBtn" class="mini-btn">🏠 Home</button>
        <button id="nextRoundBtn" class="mini-btn">Next Round</button>
        <button id="resetBtn" class="mini-btn red">Reset</button>
      </div>
      <div class="hud-right">
        <button id="sfxBtn" class="mini-btn">🔊 SFX ON</button>
        <button id="musicBtn" class="mini-btn">🔈 Music OFF</button>
      </div>
    </div>

    <div class="game-container">
      <div class="board" id="gameBoard">
        <!-- 3x3 grid -->
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>
  </div>

  <!-- 🔮 INSTALL ORB -->
  <div id="installOrb" class="install-orb hidden" title="Install RuneXO">🔮</div>

  <!-- FX Canvas (confetti) -->
  <canvas id="fxCanvas" class="fx-canvas"></canvas>

  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
