<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RuneXO</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06000f" />

<!-- Styles -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="splash.css">

<script>
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  window.deferredPrompt = e;
});
</script>
</head>

<body class="theme-rune">

<!-- Splash -->
<div id="splash-screen">
  <img src="logo-dragon.png" class="splash-logo" alt="RuneXO"/>
  <div class="splash-title">RUNEXO</div>
</div>

<!-- Title -->
<h1 class="game-title">RuneXO</h1>

<!-- Mode bar -->
<div id="modeBar" class="modebar">
  <span id="modeBadge"  class="badge">Mode: PvC</span>
  <span id="diffBadge"  class="badge">Difficulty: Easy</span>
  <span id="skinBadge"  class="badge">Skin: Runes</span>
</div>

<!-- Avatar Turn -->
<div class="avatars">
  <button id="pX" class="avatar active"><img src="icon-512.png" alt=""> Dragon</button>
  <button id="pO" class="avatar"><img src="icon-mono.png" alt=""> Phoenix</button>
</div>

<!-- Score -->
<div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>

<!-- Winner -->
<div id="msg" class="msg winner-banner">
  <span class="crown-burst">👑</span>
  <span id="winnerText"></span>
</div>

<!-- GAME BOARD -->
<div id="board" class="board" role="grid"></div>

<!-- Controls -->
<div class="btngrp">
  <button id="homeBtn" class="btn">Home</button>
  <button id="nextBtn" class="btn">Next Round</button>
  <button id="resetBtn" class="btn red">Reset All</button>
  <button id="sfxBtn" class="btn small">SFX: On</button>
  <button id="musicBtn" class="btn small">Music: Off</button>
  <button id="installBtn" class="btn small">Install App</button>
</div>

<!-- HOME SCREEN -->
<section id="homeScreen" class="home">
  <h2>RuneXO</h2>

  <label class="panel">
    <div>Game Mode</div>
    <select id="gameMode">
      <option>Player vs CPU</option>
      <option>Player vs Player</option>
    </select>
  </label>

  <label class="panel">
    <div>Difficulty</div>
    <select id="difficulty">
      <option>Easy</option>
      <option>Normal</option>
      <option>Hard</option>
    </select>
  </label>

  <label class="panel">
    <div>Skin</div>
    <select id="skin">
      <option>Runes</option>
      <option>Classic X / O</option>
      <option>Fruit</option>
    </select>
  </label>

  <label class="panel">
    <div>Theme</div>
    <select id="themeSelect">
      <option>Rune</option>
      <option>Gold</option>
      <option>Blue</option>
    </select>
  </label>

  <button id="startBtn" class="btn start">Start Game</button>
  <button id="installBtn2" class="btn small">Install App</button>

  <h3>Leaderboard (Top 10 fastest wins vs CPU)</h3>
  <ul id="leaderList" class="leader"></ul>
</section>

<!-- Scripts -->
<script type="module" src="app.js"></script>
</body>
</html>
