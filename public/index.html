<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <title>RuneXO</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <!-- PWA + CSS -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="splash.css">

  <script>
    // A2HS capture
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">
  <!-- Splash (optional logo fade) -->
  <div id="splash-screen">
    <img src="logo-dragon.png" class="splash-logo" />
    <div class="splash-title">RUNEXO</div>
  </div>

  <!-- Background particles canvas (not required but harmless) -->
  <canvas id="runeParticles"></canvas>

  <!-- Title -->
  <h1 class="game-title">RuneXO</h1>

  <!-- Mode bar -->
  <div id="modeBar" class="modebar">
    <span id="modeBadge" class="badge">Mode: PvC</span>
    <span id="diffBadge" class="badge">Difficulty: Easy</span>
    <span id="skinBadge" class="badge">Skin: Runes</span>
  </div>

  <!-- Avatars -->
  <div class="avatars">
    <div id="pX" class="avatar active"><span>🐉</span> Dragon</div>
    <div id="pO" class="avatar"><span>🕊️</span> Phoenix</div>
  </div>

  <!-- Score + winner message -->
  <div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>
  <div id="msg" class="msg winner-banner">
    <span class="crown-burst">👑</span>
    <span id="winnerText"></span>
  </div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Buttons -->
  <div class="btngrp">
    <button id="homeBtn" class="btn small">Home</button>
    <button id="nextBtn" class="btn">Next Round</button>
    <button id="resetBtn" class="btn red">Reset All</button>
    <button id="sfxBtn" class="btn small">SFX: On</button>
    <button id="musicBtn" class="btn small">Music: Off</button>
    <button id="installBtn" class="btn small">Install App</button>
  </div>

  <!-- Home screen -->
  <div id="homeScreen" class="home">
    <h2>RuneXO</h2>

    <label>Game Mode
      <select id="gameMode">
        <option>Player vs CPU</option>
        <option>Player vs Player</option>
      </select>
    </label>

    <label>Difficulty
      <select id="difficulty">
        <option>Easy</option>
        <option>Normal</option>
        <option>Hard</option>
      </select>
    </label>

    <label>Skin
      <select id="skin">
        <option>Runes</option>
        <option>Classic X / O</option>
        <option>Fruit</option>
      </select>
    </label>

    <label>Theme
      <select id="themeSelect">
        <option>Rune</option>
        <option>Blue</option>
        <option>Classic</option>
        <option>Gold</option>
      </select>
    </label>

    <div class="homeBtns">
      <button id="startBtn" class="btn">Start Game</button>
      <button id="installBtn2" class="btn small">Install App</button>
    </div>

    <h3>Leaderboard (Top 10 fastest wins vs CPU)</h3>
    <ol id="leaderList"></ol>
  </div>

  <!-- Scripts -->
  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
