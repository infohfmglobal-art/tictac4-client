<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-512.png" />
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <script>
    // Capture PWA install prompt
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">

  <!-- 🐉 INTRO SPLASH -->
  <div id="introSplash" class="intro-splash">
    <img src="./logo-dragon.png" alt="FrameWeave Studio" class="splash-logo" />
    <h1 class="splash-title glow">RuneXO</h1>
    <p class="splash-tagline">Every Move Shapes Destiny.</p>
    <p class="studio-credit">© FrameWeave Studio LLC</p>
    <audio id="introBell" src="./sound/intro.mp3" preload="auto"></audio>
  </div>

  <!-- ✨ LOGIN GATE -->
  <div id="loginGate" class="login-gate hidden">
    <h1 class="login-logo"><span class="glow">Rune</span><span class="spark">XO</span></h1>
    <p class="login-tagline">Every Move Shapes Destiny.</p>
    <button id="guestLoginGate" class="login-btn">🔥 Play as Guest</button>
    <button id="googleLoginGate" class="login-btn">🔑 Login with Google</button>
  </div>

  <!-- ⚡ GOLDEN FLASH OVERLAY -->
  <div id="flashOverlay" class="flash-overlay flash-hide"></div>

  <!-- 🏠 HOME SCREEN -->
  <div id="homeScreen" class="home-screen hidden">
    <div class="menu-box">
      <h2 class="menu-logo"><span class="glow">Rune</span><span class="spark">XO</span></h2>

      <div class="menu-row">
        <label>Game Mode</label>
        <select id="gameMode">
          <option>Player vs CPU</option>
          <option>Player vs Player</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Difficulty</label>
        <select id="difficulty">
          <option>Easy</option>
          <option>Normal</option>
          <option>Hard</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Skin</label>
        <select id="skin">
          <option>Runes</option>
          <option>Classic X / O</option>
          <option>Fruit</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Theme</label>
        <select id="themeSelect">
          <option>Rune</option>
          <option>Gold</option>
          <option>Blue</option>
          <option>Neon</option>
        </select>
      </div>

      <button id="startBtn" class="menu-btn play-btn">Play</button>
      <span id="playerCoins" class="badge coin">💰 0</span>
    </div>
  </div>
<!-- 🎮 GAME AREA -->
<div id="gameArea" class="hidden">
  <div class="game-board">
    <div class="cell" data-cell="0"></div>
    <div class="cell" data-cell="1"></div>
    <div class="cell" data-cell="2"></div>
    <div class="cell" data-cell="3"></div>
    <div class="cell" data-cell="4"></div>
    <div class="cell" data-cell="5"></div>
    <div class="cell" data-cell="6"></div>
    <div class="cell" data-cell="7"></div>
    <div class="cell" data-cell="8"></div>
  </div>

  <div class="game-controls">
    <button id="nextRound" class="menu-btn">Next Round</button>
    <button id="resetAll" class="menu-btn">Reset All</button>
    <button id="homeBtn" class="menu-btn">🏠 Home</button>
  </div>
</div>
 <!-- 🔮 INSTALL ORB -->
<div id="installOrb" class="install-orb hidden" title="Install RuneXO">🔮</div>

<!-- Scripts -->
<script type="module" src="./app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }
</script>
</body>
</html>
