<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>RuneXO</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./splash.css">

  <script>
    // PWA install capture
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">
  <!-- Splash -->
  <div id="splash-screen">
    <img src="./logo-dragon.png" class="splash-logo" alt="RuneXO">
    <div class="splash-title">RUNEXO</div>
  </div>

  <!-- Header -->
  <header class="hero">
    <h1 class="logo-title">
      <span class="glow">Rune</span><span class="spark">XO</span>
    </h1>
    <p class="tagline">Battle of Dragon 🐉 vs Phoenix 🕊️ — Tap & Win!</p>
    <div class="rune-orbs">
      <span class="orb o1">✨</span>
      <span class="orb o2">💫</span>
      <span class="orb o3">🔮</span>
      <span class="orb o4">✨</span>
      <span class="orb o5">💫</span>
      <span class="orb o6">🔮</span>
    </div>
  </header>

  <!-- Top status bar -->
  <div id="modeBar" class="topbar">
    <span id="modeBadge" class="badge">Mode: PvC</span>
    <span id="diffBadge" class="badge">Difficulty: Easy</span>
    <span id="skinBadge" class="badge">Skin: Runes</span>
    <span id="playerCoins" class="badge coin">💰 0</span>
  </div>

  <!-- Avatars -->
  <div class="avatars">
    <div id="pX" class="avatar active">🐉 Dragon</div>
    <div id="pO" class="avatar">🕊️ Phoenix</div>
  </div>

  <!-- Score + message -->
  <div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>
  <div id="msg" class="msg"><span id="winnerText"></span></div>

  <!-- Login bar (for in-game quick login) -->
  <div id="loginBar" class="login-bar">
    <button id="googleLoginBtn" class="btn bubble">Login with Google</button>
    <button id="guestLoginBtn" class="btn bubble secondary">Play as Guest</button>
  </div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Buttons -->
  <div class="btngrp">
    <button id="homeBtn"  class="btn">Home</button>
    <button id="nextBtn"  class="btn">Next Round</button>
    <button id="resetBtn" class="btn red">Reset All</button>
    <button id="sfxBtn"   class="btn small">SFX: On</button>
    <button id="musicBtn" class="btn small">Music: Off</button>
    <button id="installBtn" class="btn small">Install App</button>
  </div>

  <!-- HOME SCREEN -->
  <div id="homeScreen" class="home-screen">
    <div class="home-inner">
      <h2 class="menu-logo">
        <span class="glow">Rune</span><span class="spark">XO</span>
      </h2>

      <div class="menu-box">
        <div class="menu-row">
          <label>Game Mode</label>
          <select id="gameMode">
            <option>Player vs CPU</option>
            <option>Player vs Player</option>
          </select>
        </div>

        <div class="menu-row">
          <label>Difficulty</label>
          <select id="difficulty">
            <option>Easy</option>
            <option>Normal</option>
            <option>Hard</option>
          </select>
        </div>

        <div class="menu-row">
          <label>Skin</label>
          <select id="skin">
            <option>Runes</option>
            <option>Classic X / O</option>
            <option>Fruit</option>
          </select>
        </div>

        <div class="menu-row">
          <label>Theme</label>
          <select id="themeSelect">
            <option>Rune</option>
            <option>Gold</option>
            <option>Blue</option>
            <option>Neon</option>
            <option>Classic</option>
          </select>
        </div>

        <button id="startBtn" class="menu-btn play-btn">Play</button>

        <div class="login-cta">
          <button id="googleLoginBtnHome" class="menu-btn bubble">Login with Google</button>
          <button id="guestLoginBtnHome" class="menu-btn bubble secondary">Play as Guest</button>
          <span id="playerCoinsHome" class="badge coin">💰 0</span>
        </div>

        <button id="installBtn2" class="menu-btn secondary">Install App</button>
      </div>

      <div class="leader-wrap">
        <h3 class="leader-title">Top 10 Fastest Wins</h3>
        <ul id="leaderList" class="leader-list"></ul>
      </div>
    </div>
  </div>

  <!-- Canvas for effects -->
  <canvas id="runeParticles"></canvas>

  <script type="module" src="./app.js"></script>
  <script type="module" src="./splash.js"></script>
  <script type="module" src="./runes.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
