<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-512.png" />
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
</head>

<body class="theme-rune">
  <!-- Intro Splash -->
  <div id="introSplash" class="intro-splash">
    <img src="./logo-dragon.png" alt="FrameWeave Studio" class="splash-logo" />
    <h1 class="splash-title">RuneXO</h1>
    <p class="splash-tagline">© FrameWeave Studio LLC</p>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen hidden">
    <h1 class="login-logo">RuneXO</h1>
    <p class="login-tagline">Every Move Shapes Destiny.</p>
    <button id="guestLoginBtn" class="login-btn">🔥 Play as Guest</button>
    <button id="googleLoginBtn" class="login-btn">🔑 Login with Google</button>
  </div>

  <!-- Main Home/Game (hidden initially) -->
  <div id="homeScreen" class="home-screen hidden">
    <div class="menu-box">
      <h2 class="menu-logo"><span class="glow">Rune</span><span class="spark">XO</span></h2>
      <div class="menu-row"><label>Game Mode</label>
        <select id="gameMode"><option>Player vs CPU</option><option>Player vs Player</option></select>
      </div>
      <div class="menu-row"><label>Difficulty</label>
        <select id="difficulty"><option>Easy</option><option>Normal</option><option>Hard</option></select>
      </div>
      <div class="menu-row"><label>Skin</label>
        <select id="skin"><option>Runes</option><option>Classic X / O</option><option>Fruit</option></select>
      </div>
      <div class="menu-row"><label>Theme</label>
        <select id="themeSelect"><option>Rune</option><option>Gold</option><option>Blue</option><option>Neon</option></select>
      </div>
      <button id="startBtn" class="menu-btn play-btn">Play</button>
      <span id="playerCoins" class="badge coin">💰 0</span>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
