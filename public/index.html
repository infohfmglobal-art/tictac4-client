<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RuneXO</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="splash.css">

<script>
  // PWA install prompt
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    window.deferredPrompt = e;
  });
</script>
</head>

<body class="theme-rune">
  <!-- Splash -->
  <div id="splash-screen">
    <img src="logo-dragon.png" class="splash-logo" />
    <div class="splash-title">RUNEXO</div>
  </div>

  <!-- Canvas effects (confetti & runes can use document.body too) -->
  <canvas id="runeParticles"></canvas>

  <!-- Title -->
  <h1 class="game-title">RuneXO</h1>

  <!-- Top bar with mode/difficulty/skin/theme shown in-game -->
  <div class="modebar" id="modeBar">
    <span id="modeBadge" class="badge">Mode: PvC</span>
    <span id="diffBadge" class="badge">Difficulty: Easy</span>
    <span id="skinBadge" class="badge">Skin: Runes</span>
  </div>

  <!-- Avatars -->
  <div class="avatars">
    <div id="pX" class="avatar active">
      <img src="icon-512.png" alt="Player X">
      <span>Dragon</span>
    </div>
    <div id="pO" class="avatar">
      <img src="icon-mono.png" alt="Player O">
      <span>Phoenix</span>
    </div>
  </div>

  <!-- Score & messages -->
  <div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>
  <div id="msg" class="msg winner-banner">
    <span class="crown-burst">👑</span>
    <span id="winnerText"></span>
  </div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Controls -->
  <div class="btngrp">
    <button id="homeBtn" class="btn">Home</button>
    <button id="nextBtn" class="btn">Next Round</button>
    <button id="resetBtn" class="btn red">Reset All</button>
    <button id="sfxBtn" class="btn small">SFX: On</button>
    <button id="musicBtn" class="btn small">Music: Off</button>
    <button id="installBtn" class="btn small">Install App</button>
  </div>

  <!-- Home screen (in-page, toggled) -->
  <!-- Home / Start Screen -->
<div id="homeScreen" class="home">
  <h2 class="brand">RuneXO</h2>

  <div class="home-grid">

    <!-- Game Mode -->
    <div class="home-card">
      <label>Game Mode</label>
      <select id="gameMode">
        <option>Player vs CPU</option>
        <option>Player vs Player</option>
      </select>
    </div>

    <!-- Difficulty -->
    <div class="home-card">
      <label>Difficulty</label>
      <select id="difficulty">
        <option>Easy</option>
        <option>Normal</option>
        <option>Hard</option>
      </select>
    </div>

    <!-- Skin -->
    <div class="home-card">
      <label>Skin</label>
      <select id="skin">
        <option>Runes</option>
        <option>Classic X / O</option>
        <option>Fruit</option>
      </select>
    </div>

    <!-- Theme -->
    <div class="home-card">
      <label>Theme</label>
      <select id="themeSelect">
        <option>Rune</option>
        <option>Blue</option>
        <option>Purple</option>
        <option>Fire</option>
      </select>
    </div>

  </div>

  <div class="home-actions">
    <button id="startBtn" class="btn big">Start Game</button>
    <button id="installBtn2" class="btn ghost">Install App</button>
  </div>

  <h3 class="leader-title">Leaderboard (Top 10 fastest wins vs CPU)</h3>
  <ul id="leaderList" class="leaderbox"></ul>
</div>

    <div class="home-card">
      <label>Difficulty</label>
      <select id="difficulty">
        <option>Easy</option>
        <option>Normal</option>
        <option>Hard</option>
      </select>
    </div>

    <div class="home-card">
      <label>Skin</label>
      <select id="skin">
        <option>Runes</option>
        <option>Classic X / O</option>
        <option>Fruit</option>
      </select>
    </div>

    <div class="home-card">
      <label>Theme</label>
      <select id="themeSelect">
        <option>Rune</option>
        <option>Blue</option>
        <option>Gold</option>
        <option>Classic</option>
      </select>
    </div>

    <div class="home-card span-2">
      <div class="name-row">
        <div>
          <label>Player X name</label>
          <input id="nameX" type="text" placeholder="e.g., Ayaz" maxlength="14">
        </div>
        <div>
          <label>Player O / CPU name</label>
          <input id="nameO" type="text" placeholder="CPU" maxlength="14">
        </div>
      </div>
    </div>

    <div class="home-actions span-2">
      <button id="startBtn" class="btn big">Start Game</button>
      <button id="installBtn2" class="btn big">Install App</button>
    </div>
  </div>

  <h3 class="lb-title">Leaderboard (Top 10 fastest wins vs CPU)</h3>
  <ol id="leaderList" class="leader"></ol>
</div>

  <!-- Scripts -->
  <script type="module" src="app.js"></script>
  <script type="module" src="splash.js"></script>
  <script type="module" src="runes.js"></script>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
