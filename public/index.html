<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body class="theme-rune">
  <!-- Title / HUD -->
  <h1 class="game-title">RuneXO</h1>
  <div id="modeBar" class="hud">
    <span id="modeBadge"  class="badge">Mode: PvC</span>
    <span id="diffBadge"  class="badge">Difficulty: Easy</span>
    <span id="skinBadge"  class="badge">Skin: Runes</span>
  </div>

  <!-- Avatars / Turn indicator -->
  <div class="avatars">
    <div class="avatar" id="pX"><span>🐉</span><small>Dragon</small></div>
    <div class="avatar" id="pO"><span>🕊️</span><small>Phoenix</small></div>
  </div>

  <!-- Score + message -->
  <div id="score" class="score">Score – X: 0 | O: 0 | D: 0</div>
  <div id="msg" class="msg"><span id="winnerText"></span></div>

  <!-- Board -->
  <div id="board" class="board"></div>

  <!-- Controls -->
  <div class="btngrp">
    <button id="homeBtn"   class="btn">Home</button>
    <button id="nextBtn"   class="btn">Next Round</button>
    <button id="resetBtn"  class="btn red">Reset All</button>
    <button id="sfxBtn"    class="btn small">SFX: On</button>
    <button id="musicBtn"  class="btn small">Music: Off</button>
    <button id="installBtn" class="btn small">Install App</button>
  </div>

  <!-- Home screen -->
  <section id="homeScreen" class="home">
    <h2>RuneXO</h2>

    <label>Game Mode
      <select id="gameMode">
        <option>Player vs CPU</option>
        <option>Player vs Player</option>
      </select>
    </label>

    <label>Difficulty
      <select id="difficulty">
        <option>Easy</option>
        <option>Normal</option>
        <option>Hard</option>
      </select>
    </label>

    <label>Skin
      <select id="skin">
        <option>Runes</option>
        <option>Classic X / O</option>
        <option>Fruit</option>
      </select>
    </label>

    <label>Theme
      <select id="themeSelect">
        <option>Rune</option>
        <option>Gold</option>
        <option>Blue</option>
        <option>Classic</option>
      </select>
    </label>

    <div class="home-buttons">
      <button id="startBtn" class="btn">Start Game</button>
      <button id="installBtn2" class="btn">Install App</button>
    </div>

    <h3>Leaderboard (Top 10 fastest wins vs CPU)</h3>
    <ol id="leaderList" class="leader"></ol>
  </section>

  <!-- Simple confetti layer -->
  <canvas id="fxLayer"></canvas>

  <script type="module" src="app.js"></script>
  <script>
    window.addEventListener("beforeinstallprompt", (e)=>{ e.preventDefault(); window.deferredPrompt = e; });
    if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js"); }
  </script>
</body>
</html>
