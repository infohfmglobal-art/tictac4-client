<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RuneXO</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-512.png" />
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <script>
    // Capture PWA install prompt (don’t show banner automatically)
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
    });
  </script>
</head>

<body class="theme-rune">

  <!-- 🐉 INTRO SPLASH (3s) -->
  <div id="introSplash" class="intro-splash">
    <img src="./logo-dragon.png" alt="FrameWeave Studio" class="splash-logo" />
    <h1 class="splash-title glow">RuneXO</h1>
    <p class="splash-tagline">Every Move Shapes Destiny.</p>
    <p class="studio-credit">© FrameWeave Studio LLC</p>
  </div>

  <!-- ✨ LOGIN GATE -->
  <div id="loginGate" class="login-gate hidden">
    <h1 class="login-logo"><span class="glow">Rune</span><span class="spark">XO</span></h1>
    <p class="login-tagline">Every Move Shapes Destiny.</p>
    <button id="guestLoginGate" class="login-btn">🔥 Play as Guest</button>
    <button id="googleLoginGate" class="login-btn">🔑 Login with Google</button>
  </div>

  <!-- ⚡ GOLDEN FLASH OVERLAY -->
  <div id="flashOverlay" class="flash-overlay flash-hide"></div>

  <!-- 🏠 HOME SCREEN -->
  <div id="homeScreen" class="home-screen hidden">
  <div class="menu-box">
    <h2 class="menu-logo"><span class="glow">Rune</span><span class="spark">XO</span></h2>
    ...
  </div>

  <!-- PLAYER INFO + LOGOUT -->
  <div id="playerInfo" class="player-info">
    <span id="playerName">Guest Player</span>
    <button id="logoutBtn">Logout</button>
  </div>
</div>

      <div class="menu-row">
        <label>Difficulty</label>
        <select id="difficulty">
          <option>Easy</option>
          <option>Normal</option>
          <option>Hard</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Skin</label>
        <select id="skin">
          <option>Runes</option>
          <option>Classic X / O</option>
          <option>Fruit</option>
          <option>Emoji</option>
        </select>
      </div>

      <div class="menu-row">
        <label>Theme</label>
        <select id="themeSelect">
          <option>Rune</option>
          <option>Gold</option>
          <option>Blue</option>
          <option>Neon</option>
        </select>
      </div>

      <button id="startBtn" class="menu-btn play-btn">Play</button>
      <span id="playerCoins" class="badge coin">💰 0</span>
    </div>
  </div>

  <!-- 🎮 GAME AREA -->
  <div id="gameArea" class="hidden">
    <div class="game-container">
      <div class="board" id="gameBoard" aria-label="Tic Tac Toe board" role="grid">
        <!-- 3x3 cells -->
        <button class="cell" data-index="0" role="gridcell" aria-label="cell 1"></button>
        <button class="cell" data-index="1" role="gridcell" aria-label="cell 2"></button>
        <button class="cell" data-index="2" role="gridcell" aria-label="cell 3"></button>
        <button class="cell" data-index="3" role="gridcell" aria-label="cell 4"></button>
        <button class="cell" data-index="4" role="gridcell" aria-label="cell 5"></button>
        <button class="cell" data-index="5" role="gridcell" aria-label="cell 6"></button>
        <button class="cell" data-index="6" role="gridcell" aria-label="cell 7"></button>
        <button class="cell" data-index="7" role="gridcell" aria-label="cell 8"></button>
        <button class="cell" data-index="8" role="gridcell" aria-label="cell 9"></button>
      </div>

      <div class="controls">
        <button id="nextRoundBtn">Next Round</button>
        <button id="resetBtn">Reset All</button>
        <button id="homeBtn">🏠 Home</button>
        <button id="musicBtn" class="toggle">🔈 Music ON</button>
        <button id="sfxBtn" class="toggle">🔊 SFX ON</button>
      </div>
    </div>
  </div>

  <!-- 🔮 INSTALL ORB -->
  <div id="installOrb" class="install-orb hidden" title="Install RuneXO">🔮</div>

  <!-- Scripts -->
  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(()=>{});
    }
  </script>
</body>
</html>
